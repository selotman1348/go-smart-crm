name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end tests (fresh local Supabase)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Throwaway values for the disposable stack on the runner; not secrets.
      SEED_USER_PASSWORD: ci-only-Passw0rd
      E2E_USER_EMAIL: alex.morgan@gosmart.example
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Applies supabase/migrations and seed.sql to an empty database, so this
      # step also proves that the migrations apply cleanly from scratch.
      - name: Start Supabase
        run: >-
          npx supabase start
          -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Export Supabase settings
        run: |
          npx supabase status -o json > supabase-status.json
          jq -r '
            "NEXT_PUBLIC_SUPABASE_URL=\(.API_URL)",
            "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=\(.PUBLISHABLE_KEY // .ANON_KEY)",
            "SUPABASE_SECRET_KEY=\(.SECRET_KEY // .SERVICE_ROLE_KEY)"
          ' supabase-status.json >> "$GITHUB_ENV"
          rm supabase-status.json

      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
